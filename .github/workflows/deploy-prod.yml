name: Deploy to Github Pages

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: "npm"
      - name: Install and test
        run: |
          npm ci
          npm test
      - name: Build frontend
        run: npm run build -w @grocery-tracker/frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://grocery-tracker-app.onrender.com' }}
      - name: Deploy frontend to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./packages/frontend/dist
      - name: Trigger Render backend deployment
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"